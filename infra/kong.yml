# Kong Declarative Config — MapGIS Supabase API Gateway
# Routes: /auth/v1/* → GoTrue, /rest/v1/* → PostgREST, /realtime/v1/* → Realtime, /storage/v1/* → Storage

_format_version: "3.0"

services:
  - name: auth
    url: http://gotrue:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
            - http://localhost:8000
            - capacitor://localhost
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
          exposed_headers:
            - Content-Range
            - X-Content-Range
          credentials: true
          max_age: 3600

  - name: rest
    url: http://postgrest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
            - http://localhost:8000
            - capacitor://localhost
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - Prefer
          exposed_headers:
            - Content-Range
            - X-Content-Range
          credentials: true
          max_age: 3600

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
            - http://localhost:8000
            - capacitor://localhost
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
          credentials: true
          max_age: 3600

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:5173
            - http://localhost:8000
            - capacitor://localhost
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
          credentials: true
          max_age: 3600
